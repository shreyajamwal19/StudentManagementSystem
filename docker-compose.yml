# PostgreSQL for the research prototype (local now, same engine on cloud later).
# Credentials come from .env (not committed). Port bound to localhost only.
services:
  postgres:
    image: postgres:16
    container_name: academic-records-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academic_records}
      POSTGRES_USER: ${POSTGRES_USER:-academic_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
